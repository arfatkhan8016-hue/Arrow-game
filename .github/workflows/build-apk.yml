name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Apply custom icons
        run: |
          sudo apt-get install -y imagemagick
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            name=${d%%:*}
            size=${d##*:}
            half=$((size/2))
            convert assets/icon-only.png -resize ${size}x${size} $RES/mipmap-$name/ic_launcher.png
            convert assets/icon-only.png -resize ${size}x${size} \( -size ${size}x${size} xc:none -fill white -draw "circle $half,$half $half,0" \) -compose DstIn -composite $RES/mipmap-$name/ic_launcher_round.png
          done

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Arrows-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
